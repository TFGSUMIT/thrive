# thriveOS desktop — autologin straight to XFCE (appliance-style). The box is a
# household host you occasionally sit at, not a multi-user workstation. To require
# the LightDM login prompt instead, comment out the autologin-user line.
[Seat:*]
autologin-user=thrive
autologin-session=xfce
autologin-user-timeout=0
