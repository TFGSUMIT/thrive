# thriveOS desktop — branded LightDM login screen (dark-mono, thrive logo).
# Background can be a hex colour or an image path; #0f0f0f is thrive's --bg-primary.
[greeter]
background = #0f0f0f
default-user-image = /usr/share/pixmaps/thrive.png
hide-user-image = false
position = 50%,center 55%,center
font-name = Sans 11
xft-antialias = true
indicators = ~host;~spacer;~clock;~spacer;~session;~power
