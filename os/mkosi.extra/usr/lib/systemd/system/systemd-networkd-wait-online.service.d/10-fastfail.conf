# thriveOS: make network-online.target fail-fast when there's no network (#40).
#
# By default systemd-networkd-wait-online blocks until ALL managed links are up,
# with a 120s timeout. docker.service and thrive.service both order After=
# network-online.target, so a headless/offline boot (no cable, dead DHCP) stalls
# the whole appliance for ~2 minutes before the kiosk appears — a re-flash or a
# yanked cable shouldn't do that. thrive serves entirely from localhost, so once
# the repo is cloned + images are built the box doesn't need WAN to come up.
#
# --any     → consider the network "online" as soon as ONE link has a carrier,
#             instead of waiting on every matched interface.
# --timeout → cap the wait at 10s. If a link comes up it proceeds immediately;
#             if nothing does, wait-online exits (the target still activates —
#             a failed Wants= doesn't block it) and boot continues offline.
#
# Online boots are unaffected (wired DHCP still comes up in a few seconds); only
# the offline worst case drops from ~120s to ~10s. First-boot bootstrap (which
# genuinely needs GitHub + Docker Hub) is unchanged — it just won't hang forever
# waiting for a network that isn't there.
[Service]
ExecStart=
ExecStart=/usr/lib/systemd/systemd-networkd-wait-online --any --timeout=10
