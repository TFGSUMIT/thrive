# thriveOS Pi — DESKTOP edition profile. Applied with `mkosi --profile desktop`
# (build.sh translates `EDITION=desktop` → that). Adds the XFCE/LightDM/Firefox
# package set on top of the kiosk base; the postinst then sees lightdm is present
# and boots LightDM→XFCE instead of the cage kiosk. The shared ../mkosi.extra
# overlay supplies autologin + branding + the thrive launcher.
#
# X11 (xserver-xorg) + the Pi 5's v3d KMS gives an accelerated Xorg session;
# libgl1-mesa-dri (in the base) supplies the GL driver. cage/chromium stay in the
# image but sprout-kiosk is not enabled in this edition.
[Content]
Packages=
        xserver-xorg
        xinit
        xfce4
        xfce4-goodies
        lightdm
        lightdm-gtk-greeter
        dbus-user-session
        xfce4-terminal
        firefox-esr
        fonts-dejavu
